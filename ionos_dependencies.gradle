buildscript {
    ext {
        androidx_core = '1.13.1'
        androidx_annotation = '1.8.0'
        material = '1.12.0'
        playServicesCastVersion = '21.5.0'
        androidx_exifinterface_version = '1.3.6'
        javax_inject = '1'
        annimon_stream = '1.2.2'
        qual = '3.44.0'
        junit = '4.13.2'
        roboelectric = '4.12.2'
        scanbot_sdk_version = '6.1.1'
        preference_version = '1.2.0'
        coroutines_version = "1.6.4"
        recyclerview_version = "1.3.1"
        lifecycle_version = '2.6.2'
        gson = 'com.google.code.gson:gson:2.10.1'
        retrofit_version = '2.9.0'
        okhttp_version = '4.10.0'
        reactivex_rxandroid2 = 'io.reactivex.rxjava2:rxandroid:2.1.1'
        reactivex_rxjava2 = 'io.reactivex.rxjava2:rxjava:2.2.21'
        rxbinding_version = '3.1.0'
        constraintlayout_version = "2.1.4"
        activity_ktx_version = "1.7.2"
    }
}