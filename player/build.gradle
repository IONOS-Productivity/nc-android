buildscript {
    dependencies {
        classpath "com.android.tools.build:gradle:$androidPluginVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace 'com.ionos.player'

    defaultConfig {
        compileSdk 34
        minSdkVersion 24
        targetSdkVersion 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets.main {
        jniLibs.srcDir "src/main/libs"
        jni.srcDirs = []
    }
}

dependencies {
    api "androidx.media3:media3-common:$androidxMediaVersion"
    api "androidx.media3:media3-session:$androidxMediaVersion"
    api "androidx.media3:media3-exoplayer:$androidxMediaVersion"

    compileOnly "org.checkerframework:checker-qual:$qual"

    implementation "androidx.core:core-ktx:$androidx_core"
    implementation "androidx.appcompat:appcompat:$appCompatVersion"
    implementation "com.google.android.material:material:$material"

    implementation reactivex_rxjava2
    implementation reactivex_rxandroid2

    implementation "com.google.dagger:dagger:$daggerVersion"
    implementation "com.google.dagger:dagger-android:$daggerVersion"
    implementation "com.google.dagger:dagger-android-support:$daggerVersion"
    kapt "com.google.dagger:dagger-compiler:$daggerVersion"
    kapt "com.google.dagger:dagger-android-processor:$daggerVersion"

    api "com.annimon:stream:$annimon_stream"

    testImplementation "junit:junit:$junit"
    testImplementation "org.robolectric:robolectric:$roboelectric"
}